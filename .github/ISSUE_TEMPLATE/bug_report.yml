name: Something is wrong
description: The converted cartridge misbehaves, or a check will not run
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Most reports here turn out to be a missing submodule, a dump that is not
        the one the manifest wants, or a toolchain the build cannot reach. All
        three look identical from outside, so the first field asks you to run one
        command that tells all of us which it is.

  - type: textarea
    id: doctor
    attributes:
      label: What the doctor says
      description: |
        Run this from the repository and paste every line, including the ones
        that did not pass. Those are the ones worth reading, so do not trim it.

        macOS and Linux:

            python3 -m doctor

        Windows, whichever of these resolves:

            python -m doctor
            py -3 -m doctor

        It reports the machine as well as the package, so most answers are in
        there already. If it will not run at all, say so here and paste whatever
        it printed instead.
      render: text
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where it goes wrong
      options:
        - Building an image
        - Running the converted cartridge
        - A check or a tool in this repository
        - Somewhere else
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: |
        the rebuilt cartridge should play the same as the retail one
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: What happened instead
      description: |
        The exact output or the whole traceback. Paste it rather than describing
        it: a summary of an error loses the part that identifies it.
      render: text
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: The shortest thing that shows it
      description: Commands we can run as they stand, with no editing.
      render: shell
      placeholder: |
        python3 gate.py usa
    validations:
      required: true

  - type: input
    id: emulator
    attributes:
      label: What you ran it on
      description: The emulator or the hardware, and its version.
      placeholder: "snes9x 1.63, or a Super Nt on firmware 6.9"

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: The doctor output above is complete rather than trimmed
          required: true
        - label: I own the cartridge I am naming, and I have attached nothing from it
          required: true
