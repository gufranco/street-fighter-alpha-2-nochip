[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "build",
  "mos65xx-python",
  "snes-mapper-python",
  "snes-rom-image-python",
  "snes-sdd1-python",
  "sony-s-dsp-python",
  "sony-spc700-python",
  "validated",
  "validated-v2",
  "validated-v3",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
  "PL",
  "BLE",
  "C4",
]
ignore = [
  "PLR0913",
  "PLR2004",
  "PLR0912",
  "PLR0915",
  "PLR0911",
  "PLC0415",
  "PLR0917",
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# The environment checks are the same shape and exist for the same reason: they
# report what a machine is, so a check that throws has to become a line in the
# report rather than end the run, and its output is the product.
"environment.py" = ["BLE001", "T201"]
# The doctor exists so that nothing fails silently, which means it has to survive
# whatever a check throws at it and report that rather than propagate it. A
# narrower catch would let an unforeseen failure escape as a traceback and take
# the rest of the report with it, which is the one outcome it must avoid.
"doctor.py" = ["BLE001"]
"*.test.py" = ["PLR2004"]

[tool.coverage.run]
branch = true
source = ["."]
# The models are measured in their own repositories, where each is held to its
# own oracle and its own gate. Measuring them again from here would report the
# fraction of somebody else's project this one happens to reach, which is a
# number with no meaning and no way to move.
omit = [
  "mos65xx-python/*",
  "snes-driver-python/*",
  "snes-graphics-python/*",
  "snes-mapper-python/*",
  "snes-rom-image-python/*",
  "snes-sdd1-python/*",
  "sony-s-dsp-python/*",
  "sony-s-smp-python/*",
  "sony-spc700-python/*",
  "build/*",
  "dist/*",
  "node_modules/*",
  "asm/*",
  "ref/*",
  "scripts/*",
  "emu/*",
  "emu-stock/*",
  "validated/*",
  "validated-v2/*",
  "validated-v3/*",
]

[tool.coverage.report]
# The gate holds on a machine that has the cartridges. Measured with them hidden,
# the same suite reports 95%: every patch module skips, because a patch cannot be
# applied to a cartridge that is not there. Wiring this into a runner would
# therefore gate on a number no runner can reach, so the workflow runs the tests
# and this gate is the developer's, run where the artifacts are.
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
  # The command line guard hands argv to a function that is itself tested, so
  # there is nothing behind it left to exercise. Importing the module to cover
  # the guard would run the tool rather than test it.
  'if __name__ == "__main__":',
  # One function composes the whole build over a retail dump: it reads the
  # cartridge, runs six patches over it in order, and writes an image. Its inputs
  # cannot exist on a machine that does not have the cartridge, and a synthetic
  # four megabyte stand-in would satisfy each step by construction and prove
  # nothing about any of them. It is measured by running it, in pack.retail.test.py,
  # which reports as skipped where the dump is absent.
  'def build\(region',
  # Deriving the three cartridge variants needs the retail dump, which cannot
  # exist on a machine without the cartridge, and each patch it composes already
  # carries its own proof in spcfast.test.py and shinakuma.test.py. The loop that
  # consumes the variants takes them as a parameter and is measured.
  'def variants\(',
  # spcfast.py is generated by tools/freeze_spcfast.py, and the frame hook it
  # writes in is parked: the pattern is empty, so nothing is placed at either
  # site and neither the finder nor the run that would place it can execute. The
  # tests beside them pin that dormancy directly, through FRAME_HOOK and
  # runs_for, rather than by calling code that cannot do anything.
  'def frame_hook_site\(rom',
  'return \(\*PATCH, \(frame_hook_site\(rom\), FRAME_HOOK\)\)',
]

[tool.mypy]
# The family's flag set: strict, plus every optional error class the checker
# offers. This project rewrites cartridge code, so the errors worth catching are
# the ones where a length, an offset or a None crosses a boundary, which is what
# the optional classes are for.
strict = true
python_version = "3.12"
warn_unreachable = true
warn_no_return = true
strict_equality = true
extra_checks = true
enable_error_code = [
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]
files = ["."]
# The pinned models are separate repositories, each checked against its own
# configuration. Checking them from here would report on a toolchain nobody
# ships. build/ holds generated and third-party sources this project does not
# own.
exclude = "^(?!conformance/|tools/|[^/]+\\.py$)"
